  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=optional">
  </noscript>
  
  <!-- SEO & Standard Meta Tags -->
  <meta name="description" content="Sistem Monitoring Cerdas & Manajemen Ternak Sapi Dual-Platform Berbasis IoT." />
  <title>Smart Cattle Barn</title>

  <!-- Open Graph / Meta Tags untuk WhatsApp, Facebook, Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://smartcattlebarn.site/" />
  <meta property="og:title" content="Smart Cattle Barn" />
  <meta property="og:description" content="Sistem Monitoring Kandang & Manajemen Vitalitas Ternak Sapi Berbasis IoT." />
  <meta property="og:image" content="https://smartcattlebarn.site/logoxl.svg" />

  <!-- Twitter Meta Tags -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://smartcattlebarn.site/" />
  <meta property="twitter:title" content="Smart Cattle Barn" />
  <meta property="twitter:description" content="Sistem Monitoring Kandang & Manajemen Vitalitas Ternak Sapi Berbasis IoT." />
  <meta property="twitter:image" content="https://smartcattlebarn.site/logoxl.svg" />

  <!-- Structured Data JSON-LD untuk SEO 100/100 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Smart Cattle Barn",
    "url": "https://smartcattlebarn.site/",
    "description": "Sistem Monitoring Cerdas & Manajemen Ternak Sapi Dual-Platform Berbasis IoT.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All"
  }
  </script>
</head>

<body>

</body>

</html>
